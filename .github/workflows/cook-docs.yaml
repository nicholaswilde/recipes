---
name: cook-docs
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    paths:
      - 'cook/**/*.cook'
      - '.cookdocs.toml'
      - 'cook/recipe.md.gotmpl'
      - 'includes/emoji.yaml'
      - 'includes/weights.yaml'
      - 'cook/config/ignored_ingredients.yaml'
      - 'zensical.toml'
  push:
    branches:
      - main
    paths:
      - 'cook/**/*.cook'
      - '.cookdocs.toml'
      - 'cook/recipe.md.gotmpl'
      - 'includes/emoji.yaml'
      - 'includes/weights.yaml'
      - 'cook/config/ignored_ingredients.yaml'
      - 'zensical.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doctor:
    name: Cook-Docs Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install webp tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends webp
      - name: Install cook-docs
        env:
          COOK_DOCS_VERSION: "0.9.7"
        run: |
          mkdir -p "${HOME}/.local/bin"
          pkg="cook-docs_${COOK_DOCS_VERSION}_Linux_x86_64"
          url="https://github.com/nicholaswilde/cook-docs/releases/download/v${COOK_DOCS_VERSION}/${pkg}.tar.gz"
          curl -fsSL "${url}" | tar -xz --strip-components=1 -C "${HOME}/.local/bin" "${pkg}/cook-docs"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/cook-docs" --version
      - name: Validate cook-docs config and templates
        run: cook-docs doctor --strict
      - name: Validate Cooklang syntax and ignored ingredients
        run: |
          cook-docs doctor --only syntax,ignored
          cook-docs doctor --only ignored --strict
