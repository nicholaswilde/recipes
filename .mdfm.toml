default_format = "yaml"
output = "table"
schema = ".mdfm-schema.json"
errors_only = true
sort_arrays = ["tags"]
ignore = [
  "AGENTS.md",
  "README.md",
  "index.md",
  "reference/charts.md",
  "docs/README.md",
  "docs/index.md",
  "docs/reference/charts.md",
  "scripts/**",
  ".agents/**",
]

[[schemas]]
patterns = ["docs/reference/**", "docs/tags.md"]
schema = ".mdfm-reference-schema.json"

[[schemas]]
pattern = "cook/**/*.cook"
schema = ".mdfm-cook-schema.json"
